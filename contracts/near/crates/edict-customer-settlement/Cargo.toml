[package]
name = "edict-customer-settlement"
description = "Immutable customer-controlled Edict settlement and verifier contract for NEAR"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
edict-settlement-common = { path = "../edict-settlement-common" }
near-sdk = { workspace = true, features = ["unstable"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "unstable"] }
k256 = { version = "0.14", features = ["ecdsa"] }
