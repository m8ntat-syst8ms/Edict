[package]
name = "edict-customer-settlement-intents"
description = "Immutable customer-approved keyless Edict settlement over NEAR Intents balances"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
edict-intents-settlement-common = { path = "../edict-intents-settlement-common" }
edict-settlement-common = { path = "../edict-settlement-common" }
near-sdk = { workspace = true, features = ["unstable"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "unstable"] }
k256 = { version = "0.14", features = ["ecdsa"] }
