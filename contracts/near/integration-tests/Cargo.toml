[package]
name = "edict-near-integration-tests"
description = "Sandbox integration tests for Edict production NEAR settlement"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
near-workspaces = "0.23"
near-crypto = "0.37"
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
resolver = "2"
